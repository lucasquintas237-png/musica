<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Música</title>
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --blue:#0A84FF;
  --gutter:16px;
  --tab-h:62px; --tab-w:360px; --tab-gap:21px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --mini-h:58px;
  /* color dinámico (m3.js los reescribe con los colores de la portada) */
  --primary:#9ecaff; --on-primary:#003258; --primary-container:#00497d; --on-primary-container:#d1e4ff;
  --tint: 210 80% 60%;
  --radius-l:28px; --radius-m:16px; --radius-s:10px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --ease-emph: cubic-bezier(.05,.7,.1,1);
}
:root,[data-theme="dark"]{
  --bg:#0e0e12; --fg:#f4f4f7; --fg2:rgba(244,244,247,.66); --fg3:rgba(244,244,247,.42);
  --card:rgba(255,255,255,.07); --card-strong:rgba(255,255,255,.12); --line:rgba(255,255,255,.10);
  --shade-top:rgba(8,8,12,.30); --shade-bot:rgba(8,8,12,.72);
  --glass-fill:rgba(40,40,46,.30); --glass-rim:rgba(255,255,255,.25); --glass-edge:rgba(0,0,0,.35);
  --pill-fill:rgba(255,255,255,.12);
  --tab-ic:rgba(255,255,255,.92);
  --sheet:rgba(30,30,36,.86);
  color-scheme: dark;
}
[data-theme="light"]{
  --bg:#f3f3f6; --fg:#111114; --fg2:rgba(17,17,20,.64); --fg3:rgba(17,17,20,.42);
  --card:rgba(255,255,255,.55); --card-strong:rgba(255,255,255,.8); --line:rgba(0,0,0,.08);
  --shade-top:rgba(250,250,252,.45); --shade-bot:rgba(250,250,252,.82);
  --glass-fill:rgba(255,255,255,.32); --glass-rim:rgba(255,255,255,.8); --glass-edge:rgba(0,0,0,.12);
  --pill-fill:rgba(0,0,0,.07);
  --tab-ic:rgba(0,0,0,.86);
  --sheet:rgba(250,250,252,.9);
  color-scheme: light;
}

/* ------------------------------------------------------------------ base */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
img{display:block}
[hidden]{display:none!important}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ------------------------------------------------------------------ fondo dinámico */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
.bg-set{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.bg-set.on{opacity:1}
.bg-layer{position:absolute;background-size:cover;background-position:center;will-change:transform}
.bg-layer.far {inset:-25%;filter:blur(110px) saturate(1.7);transform:scale(1.2)}
.bg-layer.mid {width:90vmax;height:90vmax;left:-25vmax;top:-20vmax;filter:blur(70px) saturate(1.5);opacity:.75;border-radius:50%}
.bg-layer.near{width:60vmax;height:60vmax;right:-15vmax;bottom:-10vmax;filter:blur(40px) saturate(1.4);opacity:.5;border-radius:50%;transform:rotate(180deg)}
.bg-shade{position:absolute;inset:0;background:linear-gradient(180deg,var(--shade-top),var(--shade-bot))}

/* ------------------------------------------------------------------ pestañas */
#app{position:fixed;inset:0;z-index:1}
.tab,.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 0 calc(var(--tab-h) + var(--tab-gap) + var(--mini-h) + 40px + var(--safe-b));
  animation:tabIn .35s var(--ease)}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:860px;margin:0 auto;padding:0 var(--gutter)}
h1.title{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:8px 0 18px}
h2.sec{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h2.sec .more{font-size:14px;font-weight:600;color:var(--primary)}
.muted{color:var(--fg2)}
.empty{color:var(--fg3);padding:18px 4px;font-size:14px}

/* vistas (artista, álbum, lista, estadísticas) encima de la pestaña */
#view{position:fixed;inset:0;z-index:2}
body.in-view #app{visibility:hidden}
.view-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;margin:-6px 0 6px;padding:6px 0}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hero{display:flex;gap:18px;align-items:flex-end;margin:6px 0 14px;flex-wrap:wrap}
.hero img{width:min(200px,46vw);aspect-ratio:1;border-radius:var(--radius-m);object-fit:cover;box-shadow:0 18px 50px rgba(0,0,0,.35);background:var(--card)}
.hero.round img{border-radius:50%}
.hero .meta{flex:1;min-width:180px}
.hero h1{font-size:28px;line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.hero .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* botones Material 3 */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:22px;font-weight:600;font-size:15px;
  background:var(--primary);color:var(--on-primary);transition:transform .2s var(--ease),border-radius .3s var(--ease)}
.btn:active{transform:scale(.96);border-radius:12px}
.btn.tonal{background:var(--card-strong);color:var(--fg)}
.btn .ic{width:20px;height:20px}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--primary);color:var(--on-primary)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}

/* filas de canción */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:7px 6px;border-radius:12px;cursor:pointer;min-width:0;transition:background .15s}
.row:hover{background:var(--card)}
.row:active{background:var(--card-strong)}
.row .art{width:50px;height:50px;border-radius:8px;object-fit:cover;background:var(--card);flex:none}
.row .num{width:28px;text-align:center;color:var(--fg3);font-variant-numeric:tabular-nums;flex:none}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.row .s{font-size:13px;color:var(--fg2)}
.row .d{font-size:13px;color:var(--fg3);font-variant-numeric:tabular-nums}
.row .opt{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);flex:none}
.row .opt:hover{background:var(--card)}
.row.playing .t{color:var(--primary)}
.row.playing .art{outline:2px solid var(--primary);outline-offset:1px}

/* tarjetas horizontales */
.shelf{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px var(--gutter) 6px;margin:0 calc(-1 * var(--gutter));scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.card{width:148px;flex:none;scroll-snap-align:start;cursor:pointer}
.card img{width:148px;height:148px;border-radius:var(--radius-m);object-fit:cover;background:var(--card);transition:transform .25s var(--ease)}
.card:active img{transform:scale(.96)}
.card.round img{border-radius:50%}
.card .t{font-weight:600;font-size:14px;margin-top:8px}
.card .s{font-size:12.5px;color:var(--fg2)}
.tile{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--radius-m);background:var(--card);cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile .ph{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--primary-container);color:var(--on-primary-container);flex:none;overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover}

/* buscador */
.search-box{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:24px;
  background:var(--card-strong);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);margin-bottom:12px}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
.search-box .ic{color:var(--fg2)}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--fg3);border-top-color:var(--primary);animation:spin .8s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ajustes */
.group{background:var(--card);border-radius:var(--radius-m);overflow:hidden;margin-bottom:14px}
.set{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:52px;border-bottom:1px solid var(--line);cursor:pointer}
.set:last-child{border-bottom:0}
.set .lbl{flex:1;min-width:0}
.set .lbl small{display:block;color:var(--fg2);font-size:12.5px}
.set .ic{color:var(--primary)}
.seg{display:inline-flex;background:var(--card);border-radius:18px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:15px;font-size:13px;color:var(--fg2)}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.switch{width:50px;height:30px;border-radius:15px;background:var(--fg3);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch.on{background:#34C759}.switch.on::after{transform:translateX(20px)}
kbd{font:12px/1 ui-monospace,Menlo,Consolas,monospace;padding:3px 6px;border-radius:6px;background:var(--card-strong);border:1px solid var(--line)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;padding:14px;font-size:14px}

/* ------------------------------------------------------------------ mini reproductor */
#mini{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-gap) + var(--tab-h) + 10px + var(--safe-b));
  width:min(var(--tab-w), calc(100vw - 2 * var(--gutter)));height:var(--mini-h);border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 8px;
  background:var(--glass-fill);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);
  box-shadow:0 8px 30px rgba(0,0,0,.25), inset 0 1px 0 var(--glass-rim), 0 0 0 1px var(--glass-edge);cursor:pointer;overflow:hidden;
  animation:miniIn .45s var(--ease-emph)}
@keyframes miniIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translateX(-50%)}}
#mini img{width:42px;height:42px;border-radius:10px;object-fit:cover;background:var(--card)}
#mini .txt{flex:1;min-width:0}
#mini .t{font-weight:600;font-size:14px}#mini .s{font-size:12.5px;color:var(--fg2)}
#mini .b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
#mini .b .ic{width:28px;height:28px}
#mini .bar{position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:1px;background:var(--line)}
#mini .bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:1px}

/* ------------------------------------------------------------------ barra Liquid Glass (glass.js) */
#tabwrap{position:fixed;z-index:6;left:50%;bottom:calc(var(--tab-gap) + var(--safe-b));transform:translateX(-50%);
  width:min(var(--tab-w), calc(100vw - 2 * var(--gutter)));height:var(--tab-h);touch-action:none;user-select:none;-webkit-user-select:none}
.tb-bar{position:absolute;inset:0;border-radius:calc(var(--tab-h) / 2);background:var(--glass-fill);
  -webkit-backdrop-filter:blur(6px) saturate(1.8);backdrop-filter:blur(6px) saturate(1.8);
  box-shadow:0 8px 40px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.10), 0 0 0 1px var(--glass-edge)}
.tb-bar::after,.tb-pill::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 1px 1px 0 -.5px var(--glass-rim), inset -1px -1px 0 -.5px rgba(255,255,255,.12), inset 0 0 6px rgba(255,255,255,.06)}
.tb-row{position:absolute;left:0;top:0;height:var(--tab-h);display:flex;padding:0 4px}
.tb-item{width:var(--item-w);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tab-ic)}
.tb-item .ic{width:25px;height:25px}
.tb-item span{font-size:10px;font-weight:600;letter-spacing:.01em;line-height:12px}
.tb-base{-webkit-mask-image:var(--hole);mask-image:var(--hole)}
.tb-active .tb-item{color:var(--blue)}
.tb-pill{position:absolute;left:0;top:4px;height:54px;width:var(--item-w);border-radius:27px;background:var(--pill-fill);
  will-change:transform;pointer-events:none;transform-origin:50% 50%;
  box-shadow:0 0 0 0 rgba(0,0,0,0);transition:background .25s, box-shadow .25s}
.tb-pill.press{background:rgba(255,255,255,.02);box-shadow:0 6px 22px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.18)}
.tb-pill.glass{-webkit-backdrop-filter:blur(3px) saturate(1.6) brightness(1.04);backdrop-filter:blur(3px) saturate(1.6) brightness(1.04)}
.tb-lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.tb-lens .tb-row{transform-origin:0 0;will-change:transform}
.tb-pill.press .tb-active{filter:drop-shadow(-.6px 0 0 rgba(255,40,90,.35)) drop-shadow(.6px 0 0 rgba(40,160,255,.35))}

/* ------------------------------------------------------------------ reproductor completo */
#player{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(102%);transition:transform .5s var(--ease-emph);background:var(--bg)}
#player.open{transform:none}
#player .pbg{position:absolute;inset:0;z-index:0}
#player .pin{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;min-height:0;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 22px calc(var(--safe-b) + 18px)}
.p-top{display:flex;align-items:center;justify-content:space-between;height:44px}
.p-top .from{font-size:12px;text-align:center;color:var(--fg2);flex:1;min-width:0;padding:0 8px}
.p-top .from b{display:block;color:var(--fg);font-size:13px}
.icb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .15s}
.icb:hover{background:var(--card)}.icb:active{transform:scale(.9)}
.icb.on{color:var(--primary)}
.icb .dot{position:absolute;width:4px;height:4px;border-radius:2px;background:currentColor;margin-top:30px}
.p-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin:10px 0}
.p-cover{width:min(100%, 46vh);aspect-ratio:1;border-radius:22px;object-fit:cover;background:var(--card);
  box-shadow:0 30px 70px rgba(0,0,0,.45);transition:transform .55s var(--ease-emph), border-radius .55s var(--ease-emph)}
#player:not(.playing) .p-cover{transform:scale(.86);border-radius:28px}
.p-panel{position:absolute;inset:0;overflow-y:auto;border-radius:18px;scrollbar-width:none;mask-image:linear-gradient(180deg,transparent,#000 8%,#000 88%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 8%,#000 88%,transparent)}
.p-panel::-webkit-scrollbar{display:none}
.p-info{display:flex;align-items:center;gap:10px;margin-top:6px}
.p-info .txt{flex:1;min-width:0}
.p-info .t{font-size:22px;font-weight:750;letter-spacing:-.01em}
.p-info .s{font-size:16px;color:var(--fg2);cursor:pointer}
.p-info .s:hover{text-decoration:underline}
/* barra de progreso ondulada (m3.js) */
.wave{position:relative;height:36px;margin:8px 0 0;cursor:pointer;touch-action:none}
.wave svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wave .played{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round}
.wave .rest{fill:none;stroke:var(--primary);stroke-opacity:.28;stroke-width:4;stroke-linecap:round}
.wave .thumb{fill:var(--primary)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums;margin-top:-4px}
.p-ctrl{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px}
.p-ctrl .big{width:92px;height:76px;border-radius:38px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  transition:border-radius .45s var(--ease-emph), width .45s var(--ease-emph), transform .15s}
#player.playing .p-ctrl .big{border-radius:22px;width:104px}
.p-ctrl .big:active{transform:scale(.94)}
.p-ctrl .big .ic{width:38px;height:38px}
.p-ctrl .mid .ic{width:34px;height:34px}
.p-ctrl .mid{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--card)}
.p-ctrl .mid:active{transform:scale(.92)}
.p-vol{display:flex;align-items:center;gap:10px;color:var(--fg2)}
.p-vol input{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--primary) var(--v,50%),var(--card-strong) var(--v,50%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:22px;border-radius:3px;background:var(--primary)}
input[type=range]::-moz-range-thumb{width:6px;height:22px;border:0;border-radius:3px;background:var(--primary)}
.p-tools{display:flex;justify-content:space-around;margin-top:12px}
.p-tools .icb{position:relative}
/* letras */
.lyrics{padding:40% 4px 60%;font-size:26px;line-height:1.3;font-weight:750;letter-spacing:-.01em}
.lyrics p{margin:0 0 18px;color:var(--fg3);cursor:pointer;transition:color .3s, transform .3s var(--ease);transform-origin:left center}
.lyrics p.on{color:var(--fg);transform:scale(1.03)}
.lyrics.plain p{color:var(--fg);cursor:default;font-size:20px}
.lyrics .src{font-size:12px;font-weight:400;color:var(--fg3)}
/* cola */
.queue{padding:12px 0 40px}
.queue h3{font-size:15px;margin:12px 6px 6px;color:var(--fg2);font-weight:600}

/* ------------------------------------------------------------------ hoja de acciones, avisos */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet .box{width:min(520px,100%);max-height:80vh;overflow-y:auto;margin:0 8px calc(8px + var(--safe-b));padding:8px;border-radius:26px;background:var(--sheet);
  backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);animation:sheetIn .35s var(--ease-emph);box-shadow:0 20px 60px rgba(0,0,0,.3)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
#sheet .head{display:flex;gap:12px;align-items:center;padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
#sheet .head img{width:46px;height:46px;border-radius:8px;object-fit:cover}
#sheet .head b{display:block}
#sheet .it{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:14px;text-align:left;font-size:15.5px}
#sheet .it:hover{background:var(--card)}
#sheet .it .ic{color:var(--fg2)}
#sheet input[type=text]{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:0;margin:6px 0}
#toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);max-width:calc(100vw - 32px);
  padding:11px 18px;border-radius:20px;background:var(--sheet);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:14px;font-weight:500;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .4s var(--ease-emph);pointer-events:none}
#toast.on{transform:translate(-50%,0)}
#ipwarn{position:fixed;z-index:31;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);padding:12px 14px;border-radius:16px;background:#ffcc00;color:#000;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#ipwarn a{color:#000;font-weight:700}

/* reproductor de YouTube oculto: solo audio */
#yt-host{position:fixed;width:200px;height:200px;left:-400px;top:0;opacity:0;pointer-events:none;overflow:hidden}

/* estadísticas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:var(--radius-m);padding:14px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--fg2)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding:14px;background:var(--card);border-radius:var(--radius-m)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--fg2)}
.bars i{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--primary);min-height:3px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){ h1.title{font-size:40px} .card,.card img{width:170px}.card img{height:170px} }
</style>
</head>

<main id="app">
  <section class="tab" id="tab-home"></section>
  <section class="tab" id="tab-search" hidden></section>
  <section class="tab" id="tab-settings" hidden></section>
</main>
<div id="view" hidden></div>

<!-- mini reproductor -->
<div id="mini" hidden>
  <img alt="">
  <div class="txt"><div class="t ellipsis"></div><div class="s ellipsis"></div></div>
  <button class="b" data-act="toggle" aria-label="Reproducir o pausar"><svg class="ic"><use href="#i-play"/></svg></button>
  <button class="b" data-act="next" aria-label="Siguiente"><svg class="ic"><use href="#i-next"/></svg></button>
  <div class="bar"><i></i></div>
</div>

<!-- barra Liquid Glass -->
<div id="tabwrap" role="tablist" aria-label="Secciones">
  <div class="tb-bar"></div>
  <div class="tb-row tb-base">
    <button class="tb-item" role="tab" data-tab="home"><svg class="ic"><use href="#i-home"/></svg><span>Menú</span></button>
    <button class="tb-item" role="tab" data-tab="search"><svg class="ic"><use href="#i-search"/></svg><span>Buscador</span></button>
    <button class="tb-item" role="tab" data-tab="settings"><svg class="ic"><use href="#i-gear"/></svg><span>Configuración</span></button>
  </div>
  <div class="tb-pill"><div class="tb-lens"></div></div>
</div>

<!-- reproductor completo -->
<section id="player" aria-hidden="true">
  <div class="pbg"></div>
  <div class="pin">
    <div class="p-top">
      <button class="icb" data-act="close" aria-label="Cerrar"><svg class="ic"><use href="#i-down"/></svg></button>
      <div class="from"><span>Reproduciendo</span><b class="ellipsis" id="p-from">—</b></div>
      <button class="icb" data-act="more" aria-label="Más opciones"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
    <div class="p-stage">
      <img class="p-cover" alt="">
      <div class="p-panel" hidden></div>
    </div>
    <div class="p-info">
      <div class="txt"><div class="t ellipsis" id="p-title">—</div><div class="s ellipsis" id="p-artist"></div></div>
      <button class="icb" data-act="fav" aria-label="Favorito"><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>
    <div class="wave" id="p-wave" aria-label="Progreso" role="slider"></div>
    <div class="times"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div>
    <div class="p-ctrl">
      <button class="icb" data-act="shuffle" aria-label="Aleatorio"><svg class="ic"><use href="#i-shuffle"/></svg></button>
      <button class="mid" data-act="prev" aria-label="Anterior"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="big" data-act="toggle" aria-label="Reproducir o pausar"><svg class="ic"><use href="#i-play"/></svg></button>
      <button class="mid" data-act="next" aria-label="Siguiente"><svg class="ic"><use href="#i-next"/></svg></button>
      <button class="icb" data-act="repeat" aria-label="Repetir"><svg class="ic"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="p-vol"><svg class="ic"><use href="#i-vol"/></svg><input type="range" id="p-vol" min="0" max="100" value="80" aria-label="Volumen"></div>
    <div class="p-tools">
      <button class="icb" data-act="lyrics" aria-label="Letra"><svg class="ic"><use href="#i-lyrics"/></svg></button>
      <button class="icb" data-act="queue" aria-label="Cola"><svg class="ic"><use href="#i-queue"/></svg></button>
      <button class="icb" data-act="radio" aria-label="Radio"><svg class="ic"><use href="#i-radio"/></svg></button>
      <button class="icb" data-act="timer" aria-label="Temporizador"><svg class="ic"><use href="#i-timer"/></svg></button>
    </div>
  </div>
</section>

<div id="sheet" hidden></div>
<div id="toast" role="status"></div>
<div id="yt-host"><div id="yt"></div></div>

<script src="m3.js"></script>
<script src="glass.js"></script>
<script src="app.js"></script>
<script src="features.js"></script>
<script src="sources.js"></script>

</html>
